services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blotato
      POSTGRES_PASSWORD: blotato
      POSTGRES_DB: blotato
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./prisma/init-test.sql:/docker-entrypoint-initdb.d/test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blotato -d blotato"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
